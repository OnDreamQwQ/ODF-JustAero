name: Build .mrpack

# What each run is called in the Actions list. When you start a run by hand you
# can type anything into the "title" box; leave it empty and it falls back to
# "Build .mrpack #<run number>", so runs are never all identical.
# GitHub evaluates this BEFORE checking the repo out, so it cannot read the
# version out of pack/pack.toml on its own - type it in if you want it shown.
run-name: "${{ inputs.title || format('Build .mrpack #{0}', github.run_number) }}"

# GitHub Actions cannot see your Minecraft instance, so the order is:
#
#   your instance  ->  tools\Update-Pack.ps1 (local)  ->  git push
#                                                             |
#                                          then run THIS workflow by hand
#                                                             v
#   normalise index -> export .mrpack -> upload artifact -> publish the release
#
# This workflow is MANUAL ONLY. Pushing to main does NOT build or publish
# anything. Start it from the Actions tab ("Build .mrpack" -> "Run workflow")
# or from a terminal:
#
#     gh workflow run build-mrpack.yml
#     gh workflow run build-mrpack.yml -f title="v0.5.3"
#
# The version comes from pack/pack.toml, so bump it locally BEFORE pushing
# (tools\Update-Pack.ps1 -Version x.y.z -Push) if you want a new release tag.
# The "title" box only changes what the run is CALLED in the Actions list; it
# does not change the version that gets built.

on:
  # Automatic triggers are disabled on purpose: editing the README should not
  # rebuild and silently overwrite the .mrpack attached to a release.
  # Uncomment push:/schedule: again if you ever want them back.
  #
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "17 3 * * 1" # Mondays 03:17 UTC - rebuild so the release tracks the repo
  workflow_dispatch:
    inputs:
      title:
        description: 'Name for this run in the Actions list (empty = "Build .mrpack #<run number>")'
        type: string
        required: false
        default: ''
      release:
        description: Publish a GitHub Release with the .mrpack
        type: boolean
        default: true
      update_mods:
        description: Run `packwiz update --all` first (bumps every mod, may break the pack)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-mrpack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mrpack:
    name: Export .mrpack
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/packwiz" help > /dev/null
          echo "packwiz installed"

      - name: Read pack metadata
        id: meta
        working-directory: pack
        run: |
          name=$(grep -m1 '^name'    pack.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          ver=$(grep  -m1 '^version' pack.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          mc=$(grep   -m1 '^minecraft' pack.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          nf=$(grep   -m1 '^neoforge'  pack.toml | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          # every *.pw.toml (a linked download) plus every bundled *.jar
          mods=$(ls mods/*.pw.toml mods/*.jar 2>/dev/null | wc -l | tr -d ' ')
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$ver"     >> "$GITHUB_OUTPUT"
          echo "mrpack=$name-$ver.mrpack" >> "$GITHUB_OUTPUT"
          echo "mc=$mc"           >> "$GITHUB_OUTPUT"
          echo "neoforge=$nf"     >> "$GITHUB_OUTPUT"
          echo "mods=$mods"       >> "$GITHUB_OUTPUT"
          echo "pack = $name $ver (MC $mc / NeoForge $nf, $mods mods)"

      # packwiz downloads every external file once to record its size.
      # Caching this turns a ~3 minute export into a few seconds.
      - name: Cache packwiz downloads
        uses: actions/cache@v4
        with:
          path: .packwiz-cache
          key: packwiz-${{ runner.os }}-${{ hashFiles('pack/index.toml') }}
          restore-keys: |
            packwiz-${{ runner.os }}-

      - name: Refresh index
        working-directory: pack
        run: packwiz --cache ../.packwiz-cache refresh

      - name: Check the committed index is not stale
        working-directory: pack
        run: |
          if ! git diff --quiet -- index.toml pack.toml; then
            echo "::warning::pack/index.toml was stale - run tools\\Update-Pack.ps1 locally and commit the result"
          else
            echo "index is up to date"
          fi

      - name: Bump every mod (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_mods }}
        working-directory: pack
        run: packwiz --cache ../.packwiz-cache update --all

      - name: Export .mrpack
        working-directory: pack
        env:
          OUT: ${{ steps.meta.outputs.mrpack }}
        run: |
          mkdir -p ../dist
          packwiz --cache ../.packwiz-cache modrinth export \
            -o "../dist/$OUT" \
            --restrictDomains=false
          ls -lh ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.mrpack }}
          path: dist/*.mrpack
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          files: dist/*.mrpack
          fail_on_unmatched_files: true

          # GitHub 自动生成的 "What's Changed" 区块是英文的，而且本仓库是直接往
          # main 推提交、不走 PR，它只会列出一串原始提交标题，跟下面手写的中文
          # 更新日志重复。所以关掉。想恢复自动生成就把它改成 true。
          generate_release_notes: false

          # 更新日志链接必须写完整的 https://github.com/... 绝对地址，不能用
          # 以 / 开头的根相对路径。Release 正文渲染时会被当作「本 tag 的仓库根
          # 目录下的一个文件」，于是 /owner/repo/blob/main/CHANGELOG.md 被拼成
          #   /owner/repo/blob/v0.5.2/owner/repo/blob/main/CHANGELOG.md
          # 一个 404 的死链（v0.5.0 ~ v0.5.2 都中过这个招）。加上 https://github.com
          # 前缀，GitHub 才会原样输出。
          # 锚点 #v<版本号> 由 CHANGELOG.md 里手写的 <a id="v0.5.0"></a> 提供；
          # 万一忘了写，链接仍会打开 CHANGELOG.md，只是不会自动滚到那一节。
          body: |
            **Minecraft ${{ steps.meta.outputs.mc }} / NeoForge ${{ steps.meta.outputs.neoforge }}** ・ 共 **${{ steps.meta.outputs.mods }}** 个 mod

            用**第三方启动器**导入即可。

            [更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#v${{ steps.meta.outputs.version }})

            ---

            本版本由 GitHub Actions 从仓库里的 `pack/` 自动构建，请勿手动修改。
