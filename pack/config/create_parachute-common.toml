[visual]
	#伞面方向平滑插值系数（lerp），0 表示完全不跟，1 表示瞬间跟上。推荐 0.5~0.95
	# Default: 0.85
	# Range: 0.01 ~ 1.0
	clientDirSmoothing = 0.85
	#伞面飘动速度，每 tick 的相位增量。0 则不动，推荐 0.2~1.0
	# Default: 0.4
	# Range: 0.0 ~ 5.0
	wobbleFrequency = 0.4
	#伞旋转的基准阻尼系数。数值越小伞越粘滞、转向越慢
	# Default: 0.4
	# Range: 0.01 ~ 1.0
	slerpBase = 0.4
	#动态阻尼的角度阈值（度）。当前朝向与目标夹角小于此值时，slerp 系数从 1.0 线性过渡到 slerpBase，大于此值时使用 slerpBase
	# Default: 7.5
	# Range: 0.1 ~ 90.0
	slerpAngleThreshold = 7.5
	#Yaw 阻尼角度阈值（度）。伞面(vel)与体空间 Y 轴夹角小于此值时，用 cos 增强 yaw 阻尼：cos(angle/threshold * π/2)
	# Default: 20.0
	# Range: 1.0 ~ 90.0
	yawDampThreshold = 20.0
	#Yaw 阻尼最大倍率。夹角 0° 时 slerp *= 1 - 此值（0°=强阻尼，阈值=无阻尼）
	# Default: 0.9
	# Range: 0.0 ~ 1.0
	yawDampForce = 0.9
	#飘动绕 X 轴的最大摆动角度（度）
	# Default: 0.6
	# Range: 0.0 ~ 20.0
	wobbleXAmp = 0.6
	#飘动绕 Z 轴的最大摆动角度（度）——大伞 & 普通伞
	# Default: 0.5
	# Range: 0.0 ~ 20.0
	wobbleZAmpBig = 0.5
	#飘动绕 Z 轴的最大摆动角度（度）——小伞类型（伞名不含 big 的伞）
	# Default: 0.5
	# Range: 0.0 ~ 20.0
	wobbleZAmpSmall = 0.5
	#飘动 X 轴频率倍率，乘以 wobblePhase
	# Default: 1.1
	# Range: 0.0 ~ 5.0
	wobbleXFreqMult = 1.1
	#飘动 Z 轴频率倍率，乘以 wobblePhase
	# Default: 1.3
	# Range: 0.0 ~ 5.0
	wobbleZFreqMult = 1.3
	#伞（方块实体）渲染器的最大可见距离，单位格，上限 65536（2^16），设为 0 则用默认值 512。
	#这是客户端自己的渲染设置；原版上限 1024 只是历史值，数学上 65536 完全安全
	#（原版判断是 Vec3.closerThan(pos, (double) viewDistance)，double 运算不会溢出）。
	#注意实际能看多远还受客户端区块加载距离限制：伞是方块实体，区块没加载就没有实体可渲染，
	#所以原版设置下有效上限约等于客户端渲染距离（最高 32 区块 = 512 格），
	#装了提高渲染距离/区块缓存的模组才能真正用到大数值。
	# Default: 512
	# Range: 0 ~ 65536
	viewDistance = 512
	#伞贴图的显存预算，单位 MB；0 = 不限（默认 512）。
	#只统计本模组自己上传的贴图（原生贴图 + 染色用白底贴图 + OBJ 的每材质贴图，含 mip 链约 ×1.33）。
	#用到预算上限后，后面的伞不会加载贴图（该伞暂时按默认蘑菇伞显示），
	#并且会回收「超过 20 秒没被取用」的伞来腾地方，腾出来就自动继续加载 ——
	#所以只有同时在场、又超过预算的伞会退化成默认伞，日志里会有明确提示。
	#改小可以显著省显存，代价是同一时间能看到的不同伞少一些。
	# Default: 512
	# Range: 0 ~ 16384
	textureBudgetMB = 512
	#伞模型不透明层的几何/剔除策略，**开不开光影都用这一套**（两种情况外观一致）。
	#顶点数是一倍还是两倍，帧数差别很大：实测 98 万面的 AH-64D 在 Photon 下
	#DOUBLE 约 14ms/帧、SINGLE_* 约 7ms/帧。
	#SINGLE_CULL（默认）：只发一份 + 剔除背面。光照一定正确（画出来的片元法线必然朝向相机），
	#  代价是只有一层几何的薄片零件从背面看会消失（出现小孔）。
	#DOUBLE：每个三角形发两份（绕序相反、法线各朝一侧）+ 剔除背面。
	#  薄片两面都看得见，代价是顶点/显存 ×2。
	#SINGLE_NO_CULL：只发一份 + 不剔除背面，靠着色器按 gl_FrontFacing 翻背面法线。
	#  无光影时本模组自己的着色器就会翻 -> 完全无损（两面都看得见、光照也对）；
	#  开光影时要用光影包的着色器，需要光影包自己翻，否则薄片背面光照会反：
	#  Photon 把 shaders/program/gbuffers_all_solid.fsh 里的 `#define flat_normal tbn[2]`
	#  改成 `#define flat_normal (gl_FrontFacing ? tbn[2] : -tbn[2])` 即可。
	#半透明层固定「两份 + 剔除」（不剔除的话正反面片元会各混合一次，颜色明显加深）；
	#另外会自动检测「单面片」：模型里有零厚度的平面/薄壳（比如内置蘑菇伞那两块贴图板）时，
	#  该模型的不透明层改用不剔除背面的 RenderType（bbmodel）/ 给这些组强制发两份（OBJ 烘焙），
	#  不受上面这个选项影响 —— 否则薄片从背面看会整片消失。普通模型仍然照上面的策略剔除。
	#逐帧发射路径（低于 2 万面的小模型）读的是加载时的配置值，改配置后重新加载该伞生效。
	#Allowed Values: DOUBLE, SINGLE_CULL, SINGLE_NO_CULL
	shadersGeometry = "SINGLE_CULL"
	#OBJ 模型顶点法线的自动平滑角度（度）。0 = 关闭，直接用 .obj 里的 vn。
	#DCS 转出来的 OBJ 大多是**逐面法线**（实测 AH-64D：97.9 万个面 / 259.6 万个互不相同的
	#角法线，同一个位置上平均 2.8 个不同法线），照着画曲面就是「一格一格」的硬边。
	#设成 60（默认）时按几何重算：同一个顶点（按位置 1e-4 合并，跨顶点拆分也能平滑）上，
	#与本面夹角在阈值内的面做角度加权平均，超过阈值的保持硬边。
	#30 = 只平滑很平缓的曲面；90 = 几乎全平滑（圆角也会被糊掉）；180 = 完全平均。
	#因为法线改成从几何算，它必定与绕序一致 —— 这也是 shadersGeometry=SINGLE_CULL
	#（一份几何 + 剔除背面）光照必然正确的前提。改这个值后重新加载该伞生效。
	# Default: 60.0
	# Range: 0.0 ~ 180.0
	objSmoothAngle = 60.0

[physics]
	#阻力基础系数。所有拖拽力 = -速度 * dragCoefficient * dragBase * delta
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	dragBase = 1.0
	#单轴最大线性冲量，防止极端速度下物理体爆炸
	# Default: 250.0
	# Range: 1.0 ~ 10000.0
	maxImpulsePerAxis = 250.0
	#单轴最大角冲量（扭矩上限）
	# Default: 10.0
	# Range: 0.1 ~ 1000.0
	maxTorquePerAxis = 10.0
	#开伞后宽限 tick 数，在此期间即使速度低于阈值也不会自动切伞
	# Default: 10
	# Range: 0 ~ 200
	lowSpeedGraceTicks = 10
	#服务端向客户端同步伞面方向的最小间隔（tick），越小方向越精准但带宽越高
	# Default: 5
	# Range: 1 ~ 100
	syncHeartbeatTicks = 5
	#方向变化平方和阈值。变化小于此值时跳过同步，减少网络包
	# Default: 1.0E-4
	# Range: 1.0E-8 ~ 1.0
	syncDirEpsilonSq = 1.0E-4
	#平移阻力系数上限。GUI 中 dragCoefficient 的最大值
	# Default: 100000.0
	# Range: 0.1 ~ 1000000.0
	maxDragCoefficient = 100000.0
	#旋转阻尼系数上限。GUI 中 rotationalDragCoefficient 的最大值
	# Default: 100000.0
	# Range: 0.1 ~ 1000000.0
	maxRotationalDampCoefficient = 100000.0

[download]
	#是否允许普通玩家自己用 /parachute list 和 /parachute download 拉服务器伞库。false 时这两个子指令只有 OP（权限等级 2）能用；上传、分发、删除始终需要 OP
	allowPlayerDownload = true
	#每个玩家每 tick 最多下发多少字节（0 = 不限）。下载按队列分批发送，用时间换带宽：64 KiB/tick 约等于 1.25 MiB/s，1.4 MB 的伞约 22 tick（1 秒多）传完
	# Default: 65536
	# Range: 0 ~ 1048576
	bytesPerTick = 65536
	#单个玩家最多排队多少个待发文件，超了就拒绝并要求改用单把下载，防止刷指令撑爆队列
	# Default: 512
	# Range: 1 ~ 8192
	maxPendingFiles = 512
