[projectileHit]
	#Multiplier applied to body impulses generated by Shaolib-Munitions projectile hits.
	#The base impulse is impact velocity multiplied by impact mass.
	#Set to 0.0 to disable projectile-hit impulses on physics bodies.
	# Default: 1.0
	# Range: 0.0 ~ 1.7976931348623157E308
	bodyImpulseMultiplier = 1.0

	[impactSweep.availability]
		#Controls how Shaolib-Munitions template projectiles interpret stale/dirty cache samples during the broad phase.
		#REJECT: do not trust stale/dirty cache samples. If a stale/dirty cache cell is encountered, the broad phase becomes unresolved unless the live chunk is already available through normal live sampling.
		#NARROW_ON_DIRTY_TRACE: if any stale/dirty cache cell is sampled along the broad-phase ray, try to run a live narrow phase over the traced non-live chunks. This is the most consistent mode, but it can request many live chunks when maxSyncChunkLoadsPerTick is greater than 0.
		#NARROW_ON_HIT: stale/dirty cache misses are trusted as misses, but stale/dirty cache hits trigger a live narrow phase. This is the default performance-oriented broad-phase behavior.
		#ACCEPT_HIT_AS_REAL: stale/dirty cache hits are accepted as real projectile impacts without live narrow-phase verification. This is cheapest, but may use outdated block positions; block destruction still requires a live block.
		#Allowed Values: REJECT, NARROW_ON_DIRTY_TRACE, NARROW_ON_HIT, ACCEPT_HIT_AS_REAL
		dirtyCacheResolution = "NARROW_ON_HIT"
		#Controls what happens when the broad phase reaches a chunk that has no usable cache snapshot.
		#IGNORE: do not request cache work; the current projectile continues using the unresolved broad-phase result.
		#PREFETCH: publish an asynchronous cache prefetch request for the missing chunk. The projectile does not wait for the snapshot to be restored; later projectiles or later ticks may benefit from the restored cache.
		#Allowed Values: IGNORE, PREFETCH
		missingCacheAction = "PREFETCH"
		#Radius, in chunks, around each missing broad-phase chunk to include in an asynchronous cache prefetch request.
		#0 requests only the missing chunk itself. 1 requests a 3x3 area around it.
		#Higher values can improve later projectile cache coverage, but may amplify disk IO heavily with rapid-fire weapons or fragmentation pellets.
		# Default: 0
		# Range: 0 ~ 8
		prefetchRadius = 0
		#Global per-server-tick budget for synchronous live chunk loads triggered by Shaolib-Munitions impact sweep narrow phase.
		#0 disables sweep-triggered synchronous chunk loading. This is the default and avoids server tick stalls.
		#When greater than 0, dirty/cache broad-phase results that need live verification may promote unloaded traced chunks to synchronous loads until this budget is exhausted.
		#Projectile instances whose own load policy is NEVER still never sync-load chunks.
		# Default: 0
		# Range: 0 ~ 1024
		maxSyncChunkLoadsPerTick = 0
		#Global per-server-tick budget for asynchronous cache prefetch chunks published by Shaolib-Munitions impact sweep.
		#Prefetch is non-blocking and does not make the current projectile wait for cache installation.
		#Lower this value if rapid-fire or fragmentation projectiles produce too much cache restore IO.
		# Default: 64
		# Range: 0 ~ 4096
		maxPrefetchChunksPerTick = 64

[debug]
	#When enabled, logs Shaolib-Munitions impact sweep broad/narrow-phase summaries.
	#This can be noisy with many projectiles, but it does not log every raycast sample.
	impactSweepVerbose = false
	#When enabled, logs Shaolib-Munitions block destruction attempts and results.
	blockDestroyVerbose = false
