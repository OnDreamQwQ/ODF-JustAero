[general]
	#Maximum distance between connected blocks before the link breaks.
	# Default: 10.0
	# Range: 1.0 ~ 300.0
	maxLinkDistance = 10.0
	#Maximum distance in front of the Magnet Connector to scan for other connectors.
	# Default: 5
	# Range: 1 ~ 100
	magnetScanDistance = 5
	#Radius around the scan line to check for connectors (Scan box size will be 1 + radius * 2).
	# Default: 1
	# Range: 0 ~ 10
	magnetScanRadius = 1
	#Maximum facing misalignment from directly opposing (0 degrees) for all magnet connectors to connect.
	#Degrees, not the angle to the line between blocks. Connection requires strictly less than this angle.
	# Default: 45.0
	# Range: 0.0 ~ 180.0
	magnetMaxConnectionAngle = 45.0
	#Facing misalignment in degrees above which fluid, item and electric magnet connectors disconnect.
	#Use a value larger than magnetMaxConnectionAngle to avoid repeated connecting and disconnecting.
	# Default: 90.0
	# Range: 0.0 ~ 180.0
	magnetDisconnectionAngle = 90.0
	#Facing misalignment in degrees above which magnet chain connectors disconnect.
	#Use a value larger than magnetMaxConnectionAngle to avoid repeated connecting and disconnecting.
	# Default: 90.0
	# Range: 0.0 ~ 180.0
	magnetChainDisconnectionAngle = 90.0
	#If true, connections between two blocks that are both NOT on a ship (i.e., on the ground) will be blocked.
	restrictWorldToWorldConnection = false
	#If true, connections between two blocks that are on the SAME ship will be blocked.
	restrictIntraShipConnection = false

[buffers]
	#Fluid capacity per normal or magnet hose connector, in mB. Restart the world after changing.
	#Drain buffers before reducing capacity; excess fluid will be discarded on load.
	# Default: 1000
	# Range: 1 ~ 1073741823
	fluidCapacity = 1000
	#Inventory slots per normal or magnet item hose connector. Restart the world after changing.
	#Occupied slots beyond a reduced limit remain extract-only until emptied and reloaded.
	# Default: 1
	# Range: 1 ~ 256
	itemSlots = 1
	#Energy capacity per normal or magnet electric connector, in FE. Restart the world after changing.
	#Transfer rate remains 10000 FE/t. Excess energy will be discarded when capacity is reduced.
	# Default: 100000
	# Range: 1 ~ 1073741823
	energyCapacity = 100000
