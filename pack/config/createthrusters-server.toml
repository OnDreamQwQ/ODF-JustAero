	#Advanced Contraption Controller chat delivery
	[server.advanced_controller]
		#Allow Send Chat Message nodes to broadcast nearby: the same sub-level, or a centered 3x3 chunk area in the main world. Private messages remain available when disabled. The legacy config key is retained so existing opt-outs keep working.
		allowGlobalChatBroadcast = true

	#Advanced Contraption Controller and Ship Control Module tuning
	[server.ship_control]
		#Spread shipping schedule maintenance and state updates over this many ticks. Ship physics control still runs every tick.
		# Default: 2
		# Range: 1 ~ 4
		shippingScheduleWorkSpreadTicks = 2
		#Use the experimental SCM initialization V2 matrix probe, representative propulsion sampling, and interpolated 9x9 bearing maps
		enableScmInitializationV2 = false
