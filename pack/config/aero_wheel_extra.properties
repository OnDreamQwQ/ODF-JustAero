# aero_wheel_extra —— 悬架（转向架）运行声设置
# 改完保存后约 1 秒内自动生效，无需重启游戏。

# 声音来源（v2.11.0 起）：原版矿车行进声 minecraft:entity.minecart.riding
# （此前用的是模拟铁道的转向架隆隆声 simurail:block.physics_bogey.rumble）

# 总开关
bogeySound.enabled=true

# 最大音量。实际音量 = volume * (0.35 + 0.65 * 速度归一值)，越大越响。默认 0.10
bogeySound.volume=0.10

# 音调范围：越慢越接近 pitchMin，越快越接近 pitchMax（渐近、不会卡在上限）。默认 0.75 / 1.42
bogeySound.pitchMin=0.75
bogeySound.pitchMax=1.42

# 速度映射拐点：轮子每 tick 转角（弧度）等于该值时，速度归一值 ≈ 0.5。
# 调小 → 更容易达到高音调；调大 → 音调变化更平缓。默认 0.50
bogeySound.speedHalf=0.50

# 最低发声转速（RPM）。低于该转速不播放声音。默认 32
bogeySound.minRpm=32

# 音调/音量的平滑系数（每 tick 逼近目标的比例）。越小变化越柔顺舒缓，
# 越大越跟手（0.3 以上会有明显抖动感）。默认 0.20
bogeySound.smoothing=0.20

# 轮子停转后再等多少 tick 才淡出停止（20 tick = 1 秒）。默认 20
bogeySound.stopDelayTicks=20

# 每 15 秒输出一条观测到的转速范围与对应音调/音量日志（用于标定，不需要可改 false）
bogeySound.debugSample=true


# ============ 轮子碾过地面的效果 ============

# 总开关（关闭后既不发声也不转化方块）
rollingEffect.enabled=true

# 是否播放「碾过方块」的微弱**脚步声**（用该方块自己的脚步声），以及音量。
# 0.15 = 原版玩家走路的脚步音量；嫌吵调 0.08，想更明显调 0.3
rollingEffect.soundEnabled=true
rollingEffect.soundVolume=0.15

# 【载重门槛】单个结构的**每个轮子承载的质量**必须 ≥ 门槛，轮子才会压出车辙。
# 门槛有两种算法，「按轮径」优先：
#   · loadCapacityByRadius=true（默认）⇒ 门槛 = 该结构所有轮子的**平均承载能力**，
#     单个轮子承载能力 = loadCapacityAtHalfRadius + loadKpgPerRadius × (半径 - 0.5)。
#     默认 6 + 2 × (半径 - 0.5)：0.5 半径 → 6 kpg、0.75 → 6.5 kpg、1.0 → 7 kpg。
#     ⇒ 轮径越大越难压出车辙；一个载具装了多个不同轮径的轮子时取**平均**。
#   · 关闭它（或轮架上都没装轮胎）⇒ 回退到下面的固定值。
# 载重 = 结构物理质量 ÷ 轮子数量（轮子 = 装了轮胎的轮架）。普通方块 = 1.0，游戏内显示
# 成 1 kpg，可直接按游戏里看到的数字理解。碾过音效不受本项影响。
rollingEffect.loadCapacityByRadius=true
rollingEffect.loadCapacityAtHalfRadius=6.0
rollingEffect.loadKpgPerRadius=2.0

# 【回退用的固定门槛】仅在关闭「按轮径」或没装轮胎时生效。填 0 或负数 = 不设门槛。
rollingEffect.minMassPerWheel=6.5

# 同一轮架两次触发之间的最小间隔（tick），避免高速时糊成一片。默认 3
rollingEffect.minIntervalTicks=3

# 【耕地半径例外】耕地只对半径大于该值的轮子不留下车轮印。默认 0.80
# 即：半径 ≤ 0.80 的轮子照常把耕地压成土径；
#     > 0.80（如 0.96875 标准胎、1.0 大齿轮）则不留下车轮印。
# 草方块 / 泥土 / 沙子不受此限制。
rollingEffect.farmlandMaxRadius=0.80

# 草方块 / 泥土 / 耕地 → 土径 的概率（晴天）。默认 0.25
rollingEffect.dirtPathChance=0.25

# 草方块 / 泥土 / 耕地 → 土径 的概率（下雨时，更容易压出印子）。默认 0.75
rollingEffect.dirtPathChanceRain=0.75

# 沙子 → 砂岩 的概率（红沙若开启同用此值，不受下雨影响）。默认 0.125
rollingEffect.sandstoneChance=0.125

# 是否把「红沙 → 红砂岩」也纳入转化（共用上面的砂岩概率）。默认 true
rollingEffect.convertRedSand=true

# 【地势台阶(Terrain Slabs) 兼容】装了该 mod 时地表是半砖，开启后踩到土壤半砖
# 也会留痕（草半砖→土径半砖、沙半砖→砂岩半砖），并沿用 type/waterlogged 等属性；
# 未装该 mod 时此开关无任何副作用。默认 true
rollingEffect.compatTerrainSlabs=true

# 车轮印会不会被雨冲掉：下雨时累计淋雨满 rainRevertTicks（tick，20=1秒）就冲掉。
# 有顶棚、淋不到雨的地方不会被冲掉。默认 true / 200（10 秒）
# 注：这个值同时是车辙方块自身雨冲刷检查的间隔，改了它「重进游戏后」的冲刷速度也跟着变。
rollingEffect.rainRevertEnabled=true
rollingEffect.rainRevertTicks=200

# 车轮印被雨冲刷掉之后变成什么：true = 泥土(dirt)（默认，只作用于土径类车辙）；
# false = 恢复成被压之前原来的方块（旧行为）。
rollingEffect.rainRevertToDirt=true

# 沙地的车辙会不会被雨冲掉：false（默认）= **沙/红沙压出的砂岩车辙永久保留、不会消失**；
# true = 也会被雨冲回沙子（旧行为）。只影响砂岩类车辙。
rollingEffect.rainRevertSand=false

# 车轮印冲刷动画：客户端按进度渲染半透明泥土。默认 true
rollingEffect.overlayAnimation=true

# 【性能】服务端车轮印扫描节流（tick）：每 N tick 遍历一次记录，淋雨计数一次补 N，
# 所以总冲刷时长不变、遍历开销降到 1/N。车辙很多时可调大到 4~10。默认 2
rollingEffect.revertScanIntervalTicks=2

# 【性能】冲刷进度同步给客户端的间隔（tick）。默认 10；设 0 即不同步（无动画）
rollingEffect.syncIntervalTicks=10

# 【雨天抓地力】仅对「淋得到雨的那个接触方块」生效：轮子当前压着的方块若确实在被雨淋
# （会检查天空可见度与群系降水），才把它的摩擦系数**乘以**下面的倍率；
# 有顶棚、桥下、群系不下雨的地方摩擦不变 ⇒ 不会「整个世界所有地面一起变滑」。
# 1.0 = 不干预；0.75 = 抓地力降 25%（轻微）；0.40（默认）= 明显打滑；0.25 ≈ 接近冰面。
# 参考：普通地面 1.00、泥 0.33、冰面 0.10（这是「实际生效摩擦系数」，本 mod 会自动
# 做换算，保证 0.4 倍就是真的 40%，不会被游戏内部的系数抬升吃掉）。
rollingEffect.rainGripMultiplier=0.40


# ============ 轮子转向角限制（按航速） ============

# 转向角 = 悬架收到**侧向红石强度**时轮子的偏转角（原版满信号 = ±30°）。
# 航速越高，允许的最大转角越小，开起来不至于高速急打方向。
steerLimit.enabled=true

# clamp（默认）= 只限制：转角不超过表中值（注意原生满信号只有 30°，所以表里 >30° 的段
#                本来也够不到，等于低速不受限）；
# scale        = 按比例缩放整条转向曲线，使**满信号转角恰好等于表中值**
#                （低速段会放大到 45°，比原版转得更狠）。
steerLimit.mode=clamp

# scale 模式的基准：原版满信号最大转角（度）。反编译 offroad 得 -信号/15 × 45° × 2/3 = 30°
steerLimit.nativeMaxAngle=30

# 【限制强度】只缩放**压制的幅度**，不改变表的形状：
#     实际上限 = 原生角(30°) + (表中值 - 30°) x 本值
#   默认 1.0 = 完全按表中值；0.5 = 压制量减半；0 = 不限制。平时不用动。
steerLimit.strength=1.0

# 【只要「底部」有红石输入就取消转向角限制】默认 true。底部 = 悬架正下方那一格 + 悬架底面：
#   ① 下方方块朝上输出红石（红石块 / 红石火把 / 拉杆 / 朝上的中继器比较器）
#   ② 下方那一格本身就是带电的红石线
#   ③ 线控（Drive By Wire）的线接在「悬架底面」或「下方那一格顶面」
# （不认「下方那一格被充能」—— 车里的红石线从它旁边经过会被误判成有输入）
steerLimit.bottomRedstoneOverride=true

# 【线控的线网信号是否也算「底部通入」】默认 true。
# 线网值会做**活性校验**：world 通道（红石驱动的线）用当前真实红石实时重算；
# 遥控器按键查它在册的超时表，一松开就立刻按 0，还在册的按脉冲处理（见下一项）。
steerLimit.bottomRedstoneIncludeWire=true

# 【线网脉冲最长持续时间（tick）】默认 100（5 秒）。
# 只作用于无法用真实红石实时验证的线网信号（遥控器按键等）：一次通入最多让转向角
# 豁免这么久，值再变化就重新计时。真实红石与 world 通道的线不受影响。
# 它的作用是保证「通入一次就永远取消限制」在任何情况下都不会发生。
steerLimit.wireLeaseTicks=100

# 【航速(格/秒):最大转角(度)】表，逗号分隔；点之间**线性插值**，
# 第一个点之前恒定（0~5 恒 45°）、超过最后一个点保持不变。默认即你给的原始曲线。
steerLimit.angleTable=5:45,10:22.5,15:15,20:11.25,25:9,30:7.5,35:6.4,40:5.6,45:5,50:4.5

# 【强行放置：无视物理结构（Sable 子世界）的碰撞判定】默认 true。
#   Sable 会拒绝「要放置的方块与别的物理结构相交」的放置 ⇒ 站在船上 / 贴着另一艘船时
#   方块放不下去。开启后：只要原版本身允许（点击的方块可替换、或往相邻面放），就不再被
#   那条结构相交判定拦下。没装 Sable 时是空操作；想恢复原样设 false。
place.forceOnStructure=true
